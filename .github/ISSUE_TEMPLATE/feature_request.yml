name: Feature request
description: Suggest an idea for Mochi
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Say what problem it would solve before
        proposing a solution — sometimes there's a simpler fix than the
        one you're thinking of.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about and why they're worse.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Roughly how big is this change?
      options:
        - Tiny (text tweak, new quip, config option)
        - Small (new button, new sprite, new command)
        - Medium (new panel, new personality, new evolution mechanic)
        - Large (architectural change)
    validations:
      required: false
